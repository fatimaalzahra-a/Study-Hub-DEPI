<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/styles/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Acme&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Dashboard content goes here -->
    <div class="container">

        <div class="siderbar">
            <div class="logo">
                <h2>Mnemora</h2>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">Study Groups</a></li>
                    <li><a href="#">My Chats</a></li>
                    <li><a href="#">Community</a></li>
                    <li><a href="#">Planner</a></li>
                </ul>
            </div>

            <div class="Quick-Actions">
                <h3> Quick Actions</h3>
                <ul>
                    <li><a href="#">Focus Mode</a></li>
                    <li><a href="#">Study Music</a></li>
                    <li><a href="#">Dark Mode</a></li>
                </ul>
            </div>
        </div>

        <div class="main-content">

            <div class="header">
                <div class="welcome-section">
                    <h2>Welcome back, Mohamed!</h2>
                    <p>Start your learning journey today.</p>
                </div>

                <div class="header-actions">
                    <div class="notifications">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M18 8 A6 6 0 1 0 6 8 C6 14.25 4.5 16.5 4.5 16.5 H19.5 C19.5 16.5 18 14.25 18 8 Z" />
                            <path d="M13.73 21 A2 2 0 0 1 10.27 21" />
                        </svg>
                    </div>
                    <a href="#" class="upload-btn">Upload PDF</a>
                    <a href="#" class="this-week">This Week</a>

                </div>

            </div>
            <div class="cards">
                <a href="#" class="card">
                    <div class="icon-box">

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="color: var(--primary);">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    <div class="card-text">
                        <h3>Total Courses</h3>
                        <p> 12 </p>
                    </div>
                </a>
                <a href="#" class="card">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="color: var(--primary);">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="card-text">
                        <h3>Study Hours</h3>
                        <p>45h</p>
                    </div>
                </a>

                <a href="#" class="card">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="color: var(--primary);">
                            <path
                                d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z">
                            </path>
                        </svg>
                    </div>
                    <div class="card-text">
                        <h3>Streak</h3>

                    </div>

                <a href="#" class="card">
                    <div class="icon-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            style="color: var(--primary);">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M12 2C8.69 2 6 4.69 6 8v5c0 3.31 2.69 6 6 6s6-2.69 6-6V8c0-3.31-2.69-6-6-6z">
                            </path>
                        </svg>
                    </div>
                    <div class="card-text">
                        <h3>Goals</h3>
                        <p>Layout</p>
                    </div>

    </div>
